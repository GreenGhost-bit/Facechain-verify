name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[opencv,dev,evm,sign]"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy (strict)
        run: python -m mypy

      - name: Pytest (offline) + coverage
        run: python -m pytest -m "not network" --cov=facechain --cov-report=term-missing --cov-report=xml

      - name: Smoke test the CLI end to end
        run: |
          python -m facechain fetch-models
          python -m facechain doctor
          python -m facechain fetch-corpus --seed-demo
          python -m facechain build-index
          python -m facechain run samples/probe_obama.jpg --providers faceindex --anchor local --sign
          RUN="$(ls -dt runs/*/ | head -1)"
          python -m facechain verify "$RUN" --no-network
          python -m facechain report "$RUN"
          test -f "$RUN/report.html"
          python -m facechain chain verify
          python -m facechain bench --engines sface,opencv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-artifacts-py${{ matrix.python-version }}
          path: |
            runs/
            coverage.xml
          if-no-files-found: ignore
